name: Publish Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          cd extension
          zip -r ../community-watch-extension.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: community-watch-extension.zip
          name: Release ${{ github.ref_name }}
          body: |
            ### Community Watch - Shopper Review Overlay
            
            #### How to Install:
            1. Download `community-watch-extension.zip` below.
            2. Extract the zip file to any folder on your computer.
            3. Open Google Chrome and navigate to `chrome://extensions`.
            4. Enable **Developer mode** using the toggle switch in the top-right corner.
            5. Click **Load unpacked** in the top-left corner and select the extracted folder.
          draft: false
          prerelease: false
